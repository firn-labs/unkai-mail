[package]
name = "unkai-commands"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The transport-agnostic application layer (#476).
#
# Everything that used to live in `src-tauri/src/main.rs` as a
# `#[tauri::command]` body now lives here as a plain function, so the
# application logic can be exercised without spinning up a Tauri
# runtime.  Deliberately **no `tauri` dependency** — pushing anything
# UI-facing back to the shell happens through the `UiNotifier` trait
# in `notify.rs`, which the desktop crate implements on `AppHandle`.
[dependencies]
unkai-core.workspace = true
unkai-imap.workspace = true
unkai-smtp.workspace = true
unkai-jmap.workspace = true
unkai-caldav.workspace = true
unkai-carddav.workspace = true
unkai-nextcloud.workspace = true
unkai-store.workspace = true
unkai-discovery.workspace = true
