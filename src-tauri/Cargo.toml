[package]
name = "unkai-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
unkai-core.workspace = true
unkai-imap.workspace = true
unkai-smtp.workspace = true
unkai-jmap.workspace = true
unkai-caldav.workspace = true
unkai-carddav.workspace = true
unkai-nextcloud.workspace = true
unkai-store.workspace = true
unkai-discovery.workspace = true
tokio.workspace = true
futures.workspace = true
font-kit.workspace = true
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Desktop notifications (Issue #16). The plugin is registered on the
# Rust side so JS can `sendNotification` through the capability-gated
# IPC; Rust itself only emits events — the frontend owns formatting.
tauri-plugin-notification = "2"
# Native "Save As" / "Open" file dialogs. Used by the attachment
# Download action so the user can pick where to save the file instead
# of it landing in the default Downloads folder silently.
tauri-plugin-dialog = "2"
# "Launch on system startup" toggle (#131 follow-up).  Cross-
# platform: registers an XDG autostart entry on Linux, a
# LaunchAgent plist on macOS, and an HKCU\\…\\Run registry value
# on Windows.  Toggled from Settings → General; the user's
# `appSettings.autostart_enabled` choice is the source of truth
# and we sync it to the OS via the plugin's enable() / disable()
# IPCs.
tauri-plugin-autostart = "2"
# OS-level `mailto:` handling (#294).  Registers Unkai as the
# system's default mail-protocol handler so a mailto link clicked
# in any other app (browser, calendar, document) launches us with
# the URL — either as a fresh process (cold start) or as a
# second-instance argv (handled below via single-instance).
tauri-plugin-deep-link = "2"
# Cross-platform "second launch forwards to the running one"
# (#294).  When Unkai is already running and the OS spawns it
# again with a `mailto:` argv, this plugin shuttles the argv to
# the existing instance instead of starting a duplicate process.
# The deep-link plugin then re-emits the URL through its normal
# `on_open_url` event, so the rest of the handling code stays
# single-pathed.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Used by `custom_themes_dir()` to locate the user's config root
# the same way the rest of the app's per-platform persistence
# does.  Workspace dep so we share the same major version.
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Opens a URL in the system default browser. Used by the Nextcloud
# Login Flow v2 command to bounce the user out to their NC login page.
open = { workspace = true }
# Direct libnotify access on Linux so we can pass the `DesktopEntry`
# hint that makes notifications persist in the notification center.
# `tauri-plugin-notification` uses this same crate internally but
# doesn't expose its hint API, so we wrap it ourselves.  Linux-only:
# on Windows/macOS we keep using the Tauri plugin (whose native
# integrations are better than notify-rust's non-Linux backends).
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

# Windows-only: needed to register an explicit AppUserModelID so toast
# notifications attribute to "Unkai Mail" instead of falling back to
# the launching process (PowerShell / cmd / Git Bash) — see
# `set_app_user_model_id` in `main.rs`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
